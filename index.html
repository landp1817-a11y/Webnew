<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>404 not found</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* خلفية الفيديو السينمائية */
.video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
}

.video-background video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    filter: brightness(0.85) contrast(1.08);
}

/* طبقة داكنة أنيقة */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
    z-index: -1;
    backdrop-filter: blur(2px);
}

body {
    min-height: 100vh;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', 'Poppins', 'Tahoma', system-ui, -apple-system, sans-serif;
    padding: 20px;
    cursor: default;
    position: relative;
}

/* البطاقة الرئيسية - تصميم فاخر */
.card {
    background: linear-gradient(135deg, rgba(20, 22, 37, 0.7) 0%, rgba(10, 12, 28, 0.6) 100%);
    backdrop-filter: blur(18px);
    border-radius: 52px;
    padding: 38px 28px;
    text-align: center;
    color: white;
    box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.12);
    transition: all 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    width: 380px;
    cursor: default;
    transform-style: preserve-3d;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.2);
}

.card:hover {
    box-shadow: 0 35px 65px rgba(0,0,0,0.6);
    border-color: rgba(255,215,150,0.4);
}

.avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin-bottom: 18px;
    object-fit: cover;
    border: 3px solid rgba(255,215,150,0.7);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    transition: all 0.4s ease;
}

.avatar:hover {
    transform: scale(1.05) rotate(2deg);
    border-color: #ffdd99;
}

h2 {
    font-size: 32px;
    margin-bottom: 6px;
    letter-spacing: 1.5px;
    font-weight: 700;
    background: linear-gradient(135deg, #FFFFFF, #E0E4FF, #F5C574);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.tagline {
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 22px;
    letter-spacing: 0.6px;
    font-weight: 500;
    background: rgba(0,0,0,0.4);
    display: inline-block;
    padding: 5px 16px;
    border-radius: 40px;
    backdrop-filter: blur(4px);
}

/* COUNTER SECTION - عداد الزوار المميز */
.visitor-counter {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
    border-radius: 60px;
    padding: 10px 18px;
    margin: 5px 0 15px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    border: 1px solid rgba(255,215,150,0.4);
    transition: all 0.3s;
    width: auto;
}

.visitor-counter:hover {
    background: rgba(0,0,0,0.6);
    border-color: #ffdd99;
    transform: scale(1.02);
}

.counter-icon {
    font-size: 24px;
    filter: drop-shadow(0 0 3px gold);
}

.counter-text {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    background: linear-gradient(120deg, #f9f3d9, #ffe0a3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.counter-number {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #FFD966, #FFB347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Monaco', monospace;
    letter-spacing: 2px;
    text-shadow: 0 0 5px rgba(255,180,60,0.5);
    direction: ltr;
    display: inline-block;
    min-width: 70px;
}

.counter-label {
    font-size: 11px;
    opacity: 0.8;
    margin-left: 5px;
}

.links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 10px;
}

.links a {
    display: inline-block;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.links img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    padding: 12px;
    transition: all 0.3s ease;
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}

.links a:hover img {
    transform: translateY(-8px) scale(1.08);
    background: rgba(255,255,255,0.28);
}

.small-note {
    margin-top: 18px;
    font-size: 10px;
    opacity: 0.6;
}

/* صندوق الصوت الحديث */
.soundcloud-wrapper {
    margin: 20px 0 5px;
    border-radius: 36px;
    background: rgba(15, 20, 35, 0.65);
    backdrop-filter: blur(12px);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.35s ease;
}

.soundcloud-wrapper:hover {
    background: rgba(25, 32, 55, 0.75);
    border-color: rgba(255,215,150,0.6);
    transform: translateY(-3px);
}

.soundcloud-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: linear-gradient(90deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1));
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.soundcloud-icon {
    font-size: 14px;
    animation: subtlePulse 1.8s infinite ease;
}

.soundcloud-title {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.95;
    flex: 1;
    text-align: left;
    font-family: monospace;
}

.soundcloud-live {
    font-size: 9px;
    background: #ff5e5e;
    padding: 3px 9px;
    border-radius: 60px;
    font-weight: bold;
    box-shadow: 0 0 5px rgba(255,80,80,0.6);
    transition: 0.2s;
}

@keyframes subtlePulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 3px gold; }
}

.custom-player {
    padding: 14px 14px;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.play-pause-btn {
    background: rgba(220, 220, 255, 0.2);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    cursor: pointer;
    font-size: 20px;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    backdrop-filter: blur(8px);
}

.play-pause-btn:hover {
    background: rgba(255,215,150,0.7);
    transform: scale(1.07);
    color: #1e1e2a;
}

.progress-container {
    flex: 1;
    min-width: 140px;
}

.progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #F5C574, #FFB347);
    border-radius: 10px;
    transition: width 0.1s linear;
}

.time-info {
    font-size: 10px;
    opacity: 0.75;
    text-align: right;
    font-family: monospace;
}

.volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    padding: 4px 10px;
    border-radius: 40px;
}

#volumeSlider {
    width: 70px;
    height: 4px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.3);
    border-radius: 5px;
}

#volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #FFD966;
    cursor: pointer;
}

@keyframes blinkLive {
    0% { opacity: 0.6; background: #ff5e5e; }
    50% { opacity: 1; background: #ff8c8c; box-shadow: 0 0 8px red; }
    100% { opacity: 0.6; background: #ff5e5e; }
}

.live-active {
    animation: blinkLive 1.2s infinite ease;
}

@media (max-width: 500px) {
    .card {
        width: 95%;
        padding: 28px 18px;
    }
    .counter-number {
        font-size: 28px;
    }
}
</style>
</head>
<body>

<!-- خلفية الفيديو -->
<div class="video-background">
    <video autoplay muted loop playsinline preload="auto">
        <source src="https://archive.org/download/shabjdeed-al-nather-tal-abib-official-video/Shabjdeed%20&%20Al%20Nather%20-%20Tal%20Abib%20%5BOfficial%20Video%5D%20%D8%B4%D8%A8%20%D8%AC%D8%AF%D9%8A%D8%AF%20%D9%88%D8%A7%D9%84%D9%86%D8%A7%D8%B8%D8%B1%20-%20%D8%AA%D9%84%20%D8%A3%D8%A8%D9%8A%D8%A8.mp4">
    </video>
</div>
<div class="overlay"></div>

<div class="card">
    <img src="https://archive.org/download/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500.jpg" class="avatar" alt="avatar" onerror="this.src='https://archive.org/download/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500.jpg'">
    <h2>Unknown.exe</h2>
    <div class="tagline">⚡HACKING THIS WEB & EROR 404:) ⚡</div>

    <!-- عداد الزوار الحيوي + تأثير تفاعلي -->
    <div class="visitor-counter" id="visitorCounterBox">
        <span class="counter-icon">👁️</span>
        <span class="counter-text"></span>
        <span class="counter-number" id="viewerCount">--</span>
        <span class="counter-label">Viewer</span>
    </div>

    <div class="links">
        <a href="https://discord.gg/AaZA9asH" target="_blank" rel="noopener noreferrer">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="discord">
        </a>
    </div>
    <div class="small-note">✨FOLOW TO MORE HACKING ✨</div>
    
    <!-- مشغل الصوت المتطور -->
    <div class="soundcloud-wrapper">
        <div class="soundcloud-header">
            <span class="soundcloud-icon">🎧</span>
            <span class="soundcloud-title">BEA3 - BLATNM</span>
            <span class="soundcloud-live" id="liveBadge">● LIVE</span>
        </div>
        <div class="custom-player">
            <div class="player-controls">
                <button class="play-pause-btn" id="playPauseBtn">▶️</button>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span> / </span>
                        <span id="duration">0:00</span>
                    </div>

                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.65">

<audio id="music" preload="metadata" crossorigin="anonymous">
    <source src="https://ia601502.us.archive.org/1/items/molotof-jaw-ard-explicit-audio-ft.-shabjdeed/Molotof%20-%20Jaw%20ard%20%5BExplicit%20%5D%20%28%20Audio%20%29%20ft.%20Shabjdeed.mp3#t=80" type="audio/mpeg">
</audio>

<script>
(function(){
    // ------------------- عداد الزوار المتقدم (localStorage + session فريد) -------------------
    // المفتاح: حفظ عدد المشاهدات الفريد لكل متصفح/جلسة
    let visitorCount = 0;
    const counterElement = document.getElementById('viewerCount');
    
    // دالة لجلب العداد الحالي وتحديثه مع منع التكرار للجلسة نفسها
    function initVisitorCounter() {
        // استخدام localStorage لتخزين العدد الكلي
        let storedTotal = localStorage.getItem('site_visitor_total');
        if (storedTotal === null) {
            // إذا كان اول مرة بشكل كامل
            storedTotal = 1;
            localStorage.setItem('site_visitor_total', storedTotal);
        } else {
            storedTotal = parseInt(storedTotal, 10);
            if (isNaN(storedTotal)) storedTotal = 1;
        }
        
        // منع الزيادة المتكررة لنفس الجلسة (جلسة المتصفح)
        const sessionKey = 'visitor_session_record';
        const hasVisitedBefore = sessionStorage.getItem(sessionKey);
        
        if (!hasVisitedBefore) {
            // هذه زيارة جديدة فريدة (جلسة جديدة)
            storedTotal = storedTotal + 1;
            localStorage.setItem('site_visitor_total', storedTotal);
            sessionStorage.setItem(sessionKey, 'true');
        }
        
        // تحديث العدد المعروض
        visitorCount = storedTotal;
        if (counterElement) {
            counterElement.innerText = visitorCount;
            // تأثير لطيف عند تحميل العدد
            counterElement.style.transform = "scale(1.1)";
            setTimeout(() => { if(counterElement) counterElement.style.transform = "scale(1)"; }, 200);
        }
    }
    
    // تنفيذ العداد فورًا
    initVisitorCounter();
    
    // إضافة خيار إضافي: إذا تم فتح الصفحة من رابط خارجي يمكن إضافة وهمي، كذلك الحماية من الزيادة المفرطة
    // نضمن عدم زيادة العدد أكثر من مرة لكل جلسة تصفح
    
    // يمكن عمل تحديث وهمي رائع: عرض animate
    setInterval(() => {
        if(counterElement) {
            counterElement.style.textShadow = "0 0 4px gold";
            setTimeout(() => { if(counterElement) counterElement.style.textShadow = "none"; }, 300);
        }
    }, 8000);
    
    // ----- عناصر الصوت وتأثيرات 3D للبطاقة -----
    const audio = document.getElementById('music');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const liveBadge = document.getElementById('liveBadge');
    const card = document.querySelector(".card");
    
    let isPlaying = false;
    
    // تأثير 3D ممتاز على البطاقة
    card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = -(y - centerY) / 22;
        const rotateY = (x - centerX) / 22;
        const glowX = (x / rect.width) * 100;
        const glowY = (y / rect.height) * 100;
        card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
        card.style.background = `radial-gradient(circle at ${glowX}% ${glowY}%, rgba(255,245,210,0.16), rgba(20,25,55,0.65))`;
    });
    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) translateZ(0px)";
        card.style.background = "linear-gradient(135deg, rgba(20, 22, 37, 0.7) 0%, rgba(10, 12, 28, 0.6) 100%)";
    });
    
    // حماية
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
        if(e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's')) e.preventDefault();
    });
    
    function formatTime(seconds) {
        if(isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
    
    function updateLiveStatus(status) {
        if(!liveBadge) return;
        if(status === 'playing') {
            liveBadge.textContent = '● LIVE';
            liveBadge.style.background = '#44dd66';
            liveBadge.classList.add('live-active');
        } else if(status === 'paused') {
            liveBadge.textContent = '⏸ PAUSED';
            liveBadge.style.background = '#b87333';
            liveBadge.classList.remove('live-active');
        } else if(status === 'ended') {
            liveBadge.textContent = '● ENDED';
            liveBadge.style.background = '#777';
            liveBadge.classList.remove('live-active');
        } else {
            liveBadge.textContent = '● LOAD';
        }
    }
    
    audio.addEventListener('loadedmetadata', () => {
        if(audio.duration && isFinite(audio.duration)) {
            durationSpan.textContent = formatTime(audio.duration);
        } else {
            durationSpan.textContent = '3:45';
        }
    });
    
    audio.addEventListener('timeupdate', () => {
        if(audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeSpan.textContent = formatTime(audio.currentTime);
        } else if(audio.currentTime) {
            currentTimeSpan.textContent = formatTime(audio.currentTime);
        }
    });
    
    function togglePlay() {
        if(!audio.src) audio.load();
        if(isPlaying) {
            audio.pause();
            playPauseBtn.textContent = '▶️';
            updateLiveStatus('paused');
        } else {
            audio.play().then(() => {
                playPauseBtn.textContent = '⏸️';
                updateLiveStatus('playing');
            }).catch(() => {
                playPauseBtn.textContent = '▶️';
                updateLiveStatus('paused');
                isPlaying = false;
            });
        }
        isPlaying = !isPlaying;
    }
    
    playPauseBtn.addEventListener('click', togglePlay);
    
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        if(audio.duration && isFinite(audio.duration)) {
            audio.currentTime = percent * audio.duration;
        }
    });
    
    volumeSlider.addEventListener('input', () => {
        audio.volume = parseFloat(volumeSlider.value);
    });
    audio.volume = 0.65;
    
    audio.addEventListener('ended', () => {
        isPlaying = false;
        playPauseBtn.textContent = '▶️';
        updateLiveStatus('ended');
        audio.currentTime = 0;
        progressFill.style.width = '0%';
        currentTimeSpan.textContent = '0:00';
    });
    
    audio.addEventListener('error', () => {
        updateLiveStatus('ERROR');
        liveBadge.style.background = '#cc3333';
    });
    
    // تفعيل التشغيل التلقائي عند أول تفاعل
    let autoplayTrigger = false;
    function firstTouchPlay() {
        if(!autoplayTrigger && audio.paused) {
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
                updateLiveStatus('playing');
                autoplayTrigger = true;
            }).catch(() => {});
        }
        document.body.removeEventListener('click', firstTouchPlay);
        document.body.removeEventListener('touchstart', firstTouchPlay);
    }
    document.body.addEventListener('click', firstTouchPlay);
    document.body.addEventListener('touchstart', firstTouchPlay);
    
    // فيديو الخلفية ابدأ من ربع المدة
    const bgVideo = document.querySelector('.video-background video');
    if(bgVideo) {
        bgVideo.addEventListener('loadedmetadata', () => {
            if(bgVideo.duration && bgVideo.duration > 5) bgVideo.currentTime = bgVideo.duration / 4;
            bgVideo.play().catch(e=>console.log("bg muted ok"));
        });
        bgVideo.addEventListener('ended', () => {
            if(bgVideo.duration) bgVideo.currentTime = bgVideo.duration / 4;
            bgVideo.play();
        });
        if(bgVideo.readyState >= 1) {
            if(bgVideo.duration) bgVideo.currentTime = bgVideo.duration / 4;
            bgVideo.play();
        }
    }
    
    // زر Mystic يعطي وميض للعداد
    const mysticBtn = document.getElementById('mysticBtn');
    if(mysticBtn) {
        mysticBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const counterDiv = document.getElementById('visitorCounterBox');
            counterDiv.style.transform = "scale(1.02)";
            counterDiv.style.boxShadow = "0 0 15px gold";
            setTimeout(() => {
                counterDiv.style.transform = "scale(1)";
                counterDiv.style.boxShadow = "none";
            }, 300);
            // تأثير صوتي وهمي: نبض على العدد
            const numSpan = document.getElementById('viewerCount');
            if(numSpan) {
                numSpan.style.textShadow = "0 0 10px #ffaa33";
                setTimeout(() => numSpan.style.textShadow = "", 400);
            }
        });
    }
    
    // تحديث المدة إذا تأخر التحميل
    setTimeout(() => {
        if(audio.duration && durationSpan.textContent === '0:00') {
            durationSpan.textContent = formatTime(audio.duration);
        }
    }, 1200);
    
    // إضافة تأثير تفاعلي للعداد عند hover بطاقة
    const visitorBox = document.querySelector('.visitor-counter');
    if(visitorBox) {
        visitorBox.addEventListener('mouseenter', () => {
            visitorBox.style.background = "rgba(0,0,0,0.7)";
            visitorBox.style.borderColor = "#ffdd99";
        });
        visitorBox.addEventListener('mouseleave', () => {
            visitorBox.style.background = "rgba(0, 0, 0, 0.45)";
            visitorBox.style.borderColor = "rgba(255,215,150,0.4)";
        });
    }
})();
</script>
</body>
