<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Unknown.exe</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* خلفية الفيديو السينمائية */
.video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
}

.video-background video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    filter: brightness(0.85) contrast(1.1);
}

/* طبقة مظللة متطورة */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
    z-index: -1;
    backdrop-filter: blur(2px);
}

body {
    min-height: 100vh;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', 'Poppins', 'Tahoma', system-ui, -apple-system, sans-serif;
    padding: 20px;
    cursor: default;
    position: relative;
}

/* بطاقة فائقة الجودة */
.card {
    background: linear-gradient(135deg, rgba(20, 22, 37, 0.65) 0%, rgba(10, 12, 28, 0.55) 100%);
    backdrop-filter: blur(16px);
    border-radius: 48px;
    padding: 38px 28px;
    text-align: center;
    color: white;
    box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.12);
    transition: all 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    width: 360px;
    cursor: default;
    transform-style: preserve-3d;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.18);
}

.card:hover {
    box-shadow: 0 35px 65px rgba(0,0,0,0.5);
    border-color: rgba(255,255,255,0.3);
}

.avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin-bottom: 20px;
    object-fit: cover;
    border: 3px solid rgba(255,215,150,0.6);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    transition: all 0.4s ease;
}

.avatar:hover {
    transform: scale(1.05) rotate(2deg);
    border-color: #ffdd99;
    box-shadow: 0 20px 35px rgba(0,0,0,0.4);
}

h2 {
    font-size: 32px;
    margin-bottom: 8px;
    letter-spacing: 1.5px;
    font-weight: 700;
    background: linear-gradient(135deg, #FFFFFF, #E0E4FF, #B0C4DE);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

p {
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 20px;
    letter-spacing: 0.7px;
    font-weight: 500;
    background: rgba(0,0,0,0.3);
    display: inline-block;
    padding: 4px 14px;
    border-radius: 40px;
    backdrop-filter: blur(4px);
}

.links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 12px;
}

.links a {
    display: inline-block;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.links img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    padding: 12px;
    transition: all 0.3s ease;
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}

.links a:hover img {
    transform: translateY(-8px) scale(1.08);
    background: rgba(255,255,255,0.28);
    box-shadow: 0 15px 28px rgba(0,0,0,0.3);
}

.links:hover img:not(:hover) {
    opacity: 0.6;
    transform: scale(0.94);
}

.small-note {
    margin-top: 24px;
    font-size: 11px;
    opacity: 0.7;
    letter-spacing: 0.8px;
    font-weight: 300;
}

/* صندوق الصوت البراق */
.soundcloud-wrapper {
    margin: 22px 0 10px;
    border-radius: 32px;
    background: rgba(15, 20, 35, 0.6);
    backdrop-filter: blur(12px);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.35s ease;
}

.soundcloud-wrapper:hover {
    background: rgba(25, 32, 55, 0.7);
    border-color: rgba(255,215,150,0.5);
    transform: translateY(-3px);
}

.soundcloud-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: linear-gradient(90deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1));
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.soundcloud-icon {
    font-size: 14px;
    animation: subtlePulse 1.8s infinite ease;
}

.soundcloud-title {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.95;
    flex: 1;
    text-align: left;
    letter-spacing: 0.5px;
    font-family: monospace;
}

.soundcloud-live {
    font-size: 9px;
    background: #ff5e5e;
    padding: 3px 9px;
    border-radius: 60px;
    font-weight: bold;
    box-shadow: 0 0 5px rgba(255,80,80,0.6);
}

@keyframes subtlePulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 3px gold; }
}

.custom-player {
    padding: 16px 14px;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.play-pause-btn {
    background: rgba(220, 220, 255, 0.2);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    color: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.play-pause-btn:hover {
    background: rgba(255,215,150,0.7);
    transform: scale(1.07);
    color: #1e1e2a;
}

.progress-container {
    flex: 1;
    min-width: 150px;
}

.progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    transition: height 0.1s;
}

.progress-bar:hover {
    height: 7px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #F5C574, #FFB347, #E59866);
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 5px #ffb347;
}

.time-info {
    font-size: 10px;
    opacity: 0.75;
    text-align: right;
    font-family: monospace;
    letter-spacing: 0.5px;
}

.volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    background: rgba(0,0,0,0.25);
    padding: 4px 10px;
    border-radius: 40px;
}

.volume-control span {
    font-size: 13px;
    opacity: 0.8;
}

#volumeSlider {
    width: 70px;
    height: 4px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.3);
    border-radius: 5px;
    outline: none;
}

#volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #FFD966;
    cursor: pointer;
    box-shadow: 0 0 4px gold;
}

/* أنيميشن وامض live */
@keyframes blinkLive {
    0% { opacity: 0.6; background: #ff5e5e; }
    50% { opacity: 1; background: #ff8c8c; box-shadow: 0 0 8px red; }
    100% { opacity: 0.6; background: #ff5e5e; }
}

.live-blink {
    animation: blinkLive 1.2s infinite ease;
}

/* تأثير بصري إضافي */
.card::before {
    content: '';
    position: absolute;
    top: -2%;
    left: -2%;
    width: 104%;
    height: 104%;
    background: radial-gradient(ellipse at center, rgba(255,215,150,0.1), transparent);
    border-radius: 52px;
    z-index: -1;
    opacity: 0.5;
    pointer-events: none;
}

/* تحسين التجاوب */
@media (max-width: 480px) {
    .card {
        width: 92%;
        padding: 28px 18px;
    }
    .player-controls {
        gap: 10px;
    }
    .progress-container {
        min-width: 110px;
    }
    .volume-control {
        padding: 2px 6px;
    }
}
</style>
</head>
<body>

<!-- خلفية فيديو سينمائية جذابة -->
<div class="video-background">
    <video autoplay muted loop playsinline preload="auto">
        <source src="https://archive.org/download/shabjdeed-al-nather-tal-abib-official-video/Shabjdeed%20%26%20Al%20Nather%20-%20Tal%20Abib%20%5BOfficial%20Video%5D%20%D8%B4%D8%A8%20%D8%AC%D8%AF%D9%8A%D8%AF%20%D9%88%D8%A7%D9%84%D9%86%D8%A7%D8%B8%D8%B1%20-%20%D8%AA%D9%84%20%D8%A3%D8%A8%D9%8A%D8%A8.mp4">
    </video>
</div>
<div class="overlay"></div>

<div class="card">
    <img src="https://archive.org/download/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500.jpg" class="avatar" alt="avatar" onerror="this.src='https://archive.org/download/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500/artworks-8O0lRSZrfhsLpeyy-PW0KHg-t500x500.jpg'">
    <h2>Unknown.exe</h2>
    <p>⚡ لا للستغلال ⚡</p>

    <div class="links">
        <a href="https://discord.gg/AaZA9asH" target="_blank" rel="noopener noreferrer">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="discord">
        </a>
        <!-- اضافة ايقونة ثانية جاذبة -->
        <a href="#" target="_blank" rel="noopener noreferrer" id="mysticBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/1051/1051322.png" alt="mystic">
        </a>
    </div>
    <div class="small-note">✨ تابعنا للمزيد ✨</div>
    
    <!-- واجهة الصوت المتطورة -->
    <div class="soundcloud-wrapper">
        <div class="soundcloud-header">
            <span class="soundcloud-icon">🎧</span>
            <span class="soundcloud-title">BEA3 - BLATNM (Exclusive)</span>
            <span class="soundcloud-live" id="liveBadge">● LIVE</span>
        </div>
        <div class="custom-player">
            <div class="player-controls">
                <button class="play-pause-btn" id="playPauseBtn">▶️</button>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span> / </span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.65">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- مصدر الصوت الاحترافي بصيغة عالية الجودة -->
<audio id="music" preload="metadata" crossorigin="anonymous">
    <source src="https://ia600901.us.archive.org/35/items/klickaud_202603/%D8%A8%D9%8A%D8%B9_%D8%B4%D8%A8_%D8%AC%D8%AF%D9%8A%D8%AF_%D9%88%D8%A7%D9%84%D9%86%D8%A7%D8%B8%D8%B1_KLICKAUD.mp3#t=80" type="audio/mpeg">
</audio>

<script>
(function() {
    // ----- عناصر DOM -----
    const audio = document.getElementById('music');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const liveBadge = document.getElementById('liveBadge');
    const card = document.querySelector(".card");
    
    let isPlaying = false;
    let isAudioLoaded = false;

    // ---- تأثير الكارت 3D مع تتبع الضوء المتقدم ----
    card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = -(y - centerY) / 22;
        const rotateY = (x - centerX) / 22;
        const glowX = (x / rect.width) * 100;
        const glowY = (y / rect.height) * 100;
        
        card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(12px)`;
        card.style.background = `radial-gradient(circle at ${glowX}% ${glowY}%, rgba(255,245,210,0.18), rgba(20,25,55,0.6))`;
    });
    
    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) translateZ(0px)";
        card.style.background = "linear-gradient(135deg, rgba(20, 22, 37, 0.65) 0%, rgba(10, 12, 28, 0.55) 100%)";
        card.style.transition = "all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1)";
    });
    
    // منع الكليك الأيمن وحماية بسيطة
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 'u' || e.key === 's')) {
            e.preventDefault();
            return false;
        }
    });
    
    // ---- دوال مساعدة ----
    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
    
    function updateLiveBadge(status) {
        if (!liveBadge) return;
        if (status === 'playing') {
            liveBadge.textContent = '● LIVE';
            liveBadge.style.background = '#44dd66';
            liveBadge.style.animation = 'blinkLive 1.2s infinite ease';
            liveBadge.style.boxShadow = '0 0 8px #44ff66';
        } else if (status === 'paused') {
            liveBadge.textContent = '⏸ PAUSED';
            liveBadge.style.background = '#b87333';
            liveBadge.style.animation = 'none';
            liveBadge.style.boxShadow = 'none';
        } else if (status === 'ended') {
            liveBadge.textContent = '● FINISHED';
            liveBadge.style.background = '#777';
            liveBadge.style.animation = 'none';
        } else {
            liveBadge.textContent = '● LOADING';
            liveBadge.style.background = '#ffaa33';
        }
    }
    
    // تحميل البيانات وبدء المشغل
    audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && isFinite(audio.duration)) {
            durationSpan.textContent = formatTime(audio.duration);
            isAudioLoaded = true;
            updateLiveBadge('paused');
        } else {
            durationSpan.textContent = '0:00';
        }
    });
    
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeSpan.textContent = formatTime(audio.currentTime);
        } else if (audio.currentTime) {
            // fallback
            currentTimeSpan.textContent = formatTime(audio.currentTime);
        }
    });
    
    // تشغيل/إيقاف
    function togglePlay() {
        if (!audio.src || audio.readyState < 1) {
            console.log("loading audio..");
            audio.load();
            setTimeout(() => {
                if (audio.paused) audio.play().catch(e => console.log("auto needed"));
            }, 100);
        }
        if (isPlaying) {
            audio.pause();
            playPauseBtn.textContent = '▶️';
            updateLiveBadge('paused');
        } else {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playPauseBtn.textContent = '⏸️';
                    updateLiveBadge('playing');
                }).catch(error => {
                    console.log("Autoplay prevented, click to resume:", error);
                    playPauseBtn.textContent = '▶️';
                    updateLiveBadge('paused');
                    isPlaying = false;
                });
            } else {
                audio.play();
                playPauseBtn.textContent = '⏸️';
                updateLiveBadge('playing');
            }
        }
        isPlaying = !isPlaying;
    }
    
    playPauseBtn.addEventListener('click', togglePlay);
    
    // شريط التقدم
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const percent = Math.min(1, Math.max(0, clickX / width));
        if (audio.duration && isFinite(audio.duration)) {
            audio.currentTime = percent * audio.duration;
        }
    });
    
    // التحكم في الصوت
    volumeSlider.addEventListener('input', () => {
        audio.volume = parseFloat(volumeSlider.value);
    });
    audio.volume = 0.65;
    
    // عند انتهاء المقطع
    audio.addEventListener('ended', () => {
        isPlaying = false;
        playPauseBtn.textContent = '▶️';
        updateLiveBadge('ended');
        audio.currentTime = 0;
        progressFill.style.width = '0%';
        currentTimeSpan.textContent = '0:00';
    });
    
    audio.addEventListener('error', (e) => {
        console.warn("Audio error occurred");
        updateLiveBadge('⚠ ERROR');
        liveBadge.style.background = '#cc3333';
        playPauseBtn.textContent = '🔁';
    });
    
    // محاولة التشغيل التلقائي عند أول تفاعل مع الصفحة (أي click)
    let autoplayTriggered = false;
    function firstInteractionAutoPlay() {
        if (!autoplayTriggered && audio.paused) {
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
                updateLiveBadge('playing');
                autoplayTriggered = true;
            }).catch(() => {
                console.log("autoplay blocked, waiting for click");
            });
        }
        document.body.removeEventListener('click', firstInteractionAutoPlay);
        document.body.removeEventListener('touchstart', firstInteractionAutoPlay);
    }
    document.body.addEventListener('click', firstInteractionAutoPlay);
    document.body.addEventListener('touchstart', firstInteractionAutoPlay);
    
    // ضمان تزامن التحديث بعد تحميل البيانات بالكامل
    audio.addEventListener('canplaythrough', () => {
        if (!isPlaying && !autoplayTriggered) {
            // no force but ready
        }
        if (audio.duration && durationSpan.textContent === '0:00') {
            durationSpan.textContent = formatTime(audio.duration);
        }
    });
    
    // معالجة فيديو الخلفية وجعله يبدأ من ربع المدة لتجربة غامرة
    const bgVideo = document.querySelector('.video-background video');
    if (bgVideo) {
        bgVideo.addEventListener('loadedmetadata', () => {
            if (bgVideo.duration && bgVideo.duration > 5) {
                bgVideo.currentTime = bgVideo.duration / 4;
                bgVideo.play().catch(e => console.log("bg vid autoplay muted ok"));
            } else {
                bgVideo.play().catch(() => {});
            }
        });
        // تأمين إعادة التشغيل الحلقي بلا توقف
        bgVideo.addEventListener('ended', () => {
            if (bgVideo.duration) {
                bgVideo.currentTime = bgVideo.duration / 4;
                bgVideo.play();
            } else {
                bgVideo.currentTime = 0;
                bgVideo.play();
            }
        });
        // بدء تشغيل الخلفية فورًا إذا كان meta جاهز
        if (bgVideo.readyState >= 1) {
            bgVideo.currentTime = bgVideo.duration / 4 || 0;
            bgVideo.play();
        }
    }
    
    // إضافة حدث خاص لزر mystic الثاني يجعل الجو سحري
    const mysticBtn = document.getElementById('mysticBtn');
    if (mysticBtn) {
        mysticBtn.addEventListener('click', (e) => {
            e.preventDefault();
            // تأثير بسيط: تغيير مؤقت للون البطاقة
            card.style.transition = "all 0.2s";
            card.style.boxShadow = "0 0 20px rgba(255,200,100,0.8)";
            setTimeout(() => {
                card.style.boxShadow = "0 30px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.12)";
            }, 300);
            // تغيير النص لثانية
            const originalTitle = document.querySelector('.soundcloud-title');
            if (originalTitle) {
                originalTitle.style.opacity = '0.7';
                setTimeout(() => originalTitle.style.opacity = '1', 400);
            }
        });
    }
    
    // حماية إضافية للصوت ومنع الـ right click على المشغل
    const playerContainer = document.querySelector('.custom-player');
    if (playerContainer) playerContainer.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // تأكد من تحديث واجهة الحجم في البداية
    volumeSlider.value = audio.volume;
    
    // منع الصوت من التشويش عند بدء التشغيل التلقائي المبكر
    if (audio.readyState === 0) {
        audio.load();
    }
    
    // تحسين عرض المدة حال تحميلها بطيء
    setTimeout(() => {
        if (audio.duration && !isNaN(audio.duration) && durationSpan.textContent === '0:00') {
            durationSpan.textContent = formatTime(audio.duration);
        }
    }, 1000);
})();
</script>
</body>
</html>
